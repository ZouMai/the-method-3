<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b5bd6">
<title>Zou_Maï – Back to School</title>
<style>
:root{--ink:#182033;--muted:#5d6780;--panel:#fff;--line:#dfe4f0;--purple:#6558d9;--blue:#3785f5;--green:#35b36f;--red:#ed5d68;--yellow:#f3ba36;--shadow:0 16px 45px rgba(50,55,90,.12)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef6ff 0,#f6f0ff 46%,#fff4f7 100%);color:var(--ink);font-family:Inter,ui-rounded,"Segoe UI",Arial,sans-serif;min-height:100vh}button{font:inherit}.app{width:min(1120px,100%);margin:0 auto;padding:18px}.hero{position:relative;overflow:hidden;background:linear-gradient(130deg,#d8ebff,#e8ddff 55%,#ffdfe9);border:1px solid #d3d7f2;border-radius:28px;padding:22px;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-45px;top:-65px;background:#fff6;box-shadow:-190px 165px 0 10px #fff3}.brand{position:relative;z-index:1;font-size:12px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#5146bb}.hero-row{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.hero h1{font-size:clamp(28px,5vw,46px);margin:3px 0 4px;line-height:1}.hero p{margin:0;color:#4f5970;font-weight:750}.stats{display:flex;gap:8px}.stat{background:#fff;border-radius:16px;min-width:86px;padding:10px 14px;text-align:center;box-shadow:0 6px 18px #5f62951c}.stat b{display:block;font-size:24px;color:#5e53cf}.stat span{font-size:10px;font-weight:900;color:#6f7890;letter-spacing:.08em}.progress{position:relative;z-index:1;margin-top:17px;height:14px;border-radius:99px;background:#ffffffb8;overflow:hidden}.progress>i{display:block;height:100%;width:10%;background:linear-gradient(90deg,#3485f4,#7154e8,#e4549a);transition:width .25s ease}.stagebar{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:14px 0}.stage-chip{background:#fff;border:2px solid transparent;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 5px 14px #3d416d12;color:#667086;font-size:11px;font-weight:850;line-height:1.2}.stage-chip strong{display:block;color:#232b40;font-size:14px;margin-bottom:3px}.stage-chip.active{border-color:#6b5ce4;background:#f8f6ff;box-shadow:0 0 0 3px #e8e3ff}.stage-chip.done strong{color:#28875a}.panel{background:var(--panel);border:1px solid #e4e8f2;border-radius:28px;box-shadow:var(--shadow);padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#f7f8fc;border-radius:18px;padding:12px 14px}.stage-title{font-size:22px;font-weight:950}.instruction{font-size:14px;color:var(--muted);font-weight:750;margin-top:3px}.audio-btn,.next,.primary{border:0;border-radius:15px;padding:12px 18px;background:#3785f5;color:#fff;font-weight:900;cursor:pointer;box-shadow:0 6px 16px #3785f533}.audio-btn:active,.next:active,.primary:active{transform:translateY(1px)}.audio-btn[hidden]{display:none}.prompt{min-height:315px;margin-top:14px;border:3px dashed #b9b8ed;border-radius:24px;background:linear-gradient(145deg,#fafcff,#f0f1ff);display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.prompt-icon{font-size:90px}.prompt-label{font-size:23px;font-weight:950;color:#5a51bc;margin-top:10px}.hero-img{max-width:min(340px,75vw);max-height:260px;object-fit:contain;filter:drop-shadow(0 9px 12px #4c526022)}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.choice{min-height:88px;border:3px solid #d8deeb;background:#fff;border-radius:18px;padding:14px 12px;color:#20283a;font-size:20px;font-weight:950;cursor:pointer;box-shadow:0 5px 13px #33395b0f;transition:.13s}.choice:hover{border-color:#7b6be8;transform:translateY(-2px);box-shadow:0 8px 18px #33395b18}.choice:disabled{cursor:default}.choice.correct{border-color:#3bc17e;background:#effff6}.choice.wrong{border-color:#f0717c;background:#fff3f4}.image-choice{min-height:205px;padding:10px}.image-choice img{width:100%;height:170px;object-fit:contain}.feedback{min-height:67px;margin-top:14px;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:23px;font-weight:950;border:3px solid transparent}.feedback.good{background:#eafff2;border-color:#54cc8c;color:#185b3b;animation:feedbackPop .28s ease}.feedback.bad{background:#fff0f2;border-color:#ef7e86;color:#872f38;animation:feedbackPop .28s ease}.nav{display:flex;justify-content:center;margin-top:14px}.next{background:linear-gradient(90deg,#6558d9,#8d55dc);min-width:160px}.next:disabled{opacity:.28;cursor:not-allowed;box-shadow:none}.sentence-area{width:100%}.badge{display:inline-block;border-radius:11px;background:#fff;padding:7px 12px;border:3px solid;font-size:13px;font-weight:950;margin:3px}.badge.q{border-color:var(--blue)}.badge.pos{border-color:var(--green)}.badge.neg{border-color:var(--red)}.badge.col{border-color:var(--yellow)}.built{min-height:92px;margin-top:16px;border-radius:17px;border:3px dashed #9a91e9;background:#fff;padding:18px;font-size:24px;font-weight:950;line-height:1.35}.tiles{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:15px}.tile{background:#fff;border:3px solid #d5dbe8;border-top-width:8px;border-radius:14px;padding:12px 16px;font-size:20px;font-weight:950;cursor:pointer;box-shadow:0 4px 9px #2d315414}.tile.q{border-color:var(--blue)}.tile.pos{border-color:var(--green)}.tile.neg{border-color:var(--red)}.tile.colour{border-color:var(--yellow)!important}.tile.used{opacity:.22}.matching-wrap{width:100%;display:grid;grid-template-columns:1fr 1.25fr;gap:16px;align-items:start}.sound-list,.picture-grid{display:grid;gap:9px}.sound-list{grid-template-columns:1fr}.picture-grid{grid-template-columns:repeat(2,1fr)}.sound-card,.match-image{min-height:72px;border-radius:16px;border:3px solid #d8deeb;background:#fff;font-weight:950;cursor:pointer}.sound-card{font-size:17px}.sound-card.selected{border-color:#4d8ef7;background:#eef6ff}.sound-card.matched,.match-image.matched{border-color:#42bd78;background:#eefff5;opacity:.72}.match-image{min-height:140px;padding:8px}.match-image img{width:100%;height:120px;object-fit:contain}.end{background:linear-gradient(130deg,#fff4c9,#e5fff0,#e4efff);border:2px solid #f0d985;border-radius:26px;padding:34px 20px;text-align:center;box-shadow:var(--shadow)}.end .big{font-size:68px}.end h2{font-size:34px;margin:8px 0}.end p{font-size:18px;font-weight:800;color:#4e5b70}.hidden{display:none!important}.overlay{position:fixed;inset:0;z-index:1000;background:#ffffffef;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}.perfect-card{position:relative;z-index:2;animation:bigPop .6s cubic-bezier(.18,.86,.28,1.25);padding:25px}.perfect-card .cup{font-size:95px}.perfect-card h2{font-size:clamp(38px,9vw,75px);margin:2px;color:#5548c8}.perfect-card p{font-size:clamp(18px,4vw,29px);font-weight:950;color:#208357}.particle{position:absolute;left:50%;top:50%;font-size:34px;animation:burst 1.6s ease-out forwards}@keyframes feedbackPop{0%{transform:scale(.94);opacity:.25}100%{transform:scale(1);opacity:1}}@keyframes bigPop{0%{transform:scale(.35) rotate(-7deg);opacity:0}72%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes burst{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.25) rotate(300deg);opacity:0}}@media(max-width:800px){.stagebar{grid-template-columns:repeat(2,1fr)}.answers{grid-template-columns:repeat(2,1fr)}.matching-wrap{grid-template-columns:1fr}.picture-grid{grid-template-columns:repeat(4,1fr)}.match-image{min-height:100px}.match-image img{height:80px}}@media(max-width:520px){.app{padding:10px}.hero,.panel{border-radius:21px}.stats{width:100%}.stat{flex:1}.prompt{min-height:245px}.answers{grid-template-columns:1fr 1fr;gap:8px}.choice{font-size:17px;min-height:78px;padding:10px 8px}.image-choice{min-height:155px}.image-choice img{height:125px}.picture-grid{grid-template-columns:repeat(2,1fr)}.stage-title{font-size:19px}.feedback{font-size:19px}.tile{font-size:18px;padding:10px 13px}.built{font-size:21px}.hero-img{max-height:200px}}

.home-screen{position:fixed;inset:0;z-index:1200;overflow:auto;background:linear-gradient(145deg,#dff2ff 0%,#eee5ff 46%,#ffe7ef 100%);padding:24px;display:flex;align-items:center;justify-content:center}.home-card{width:min(980px,100%);background:#ffffffee;border:1px solid #dfe4f0;border-radius:32px;padding:clamp(22px,5vw,48px);box-shadow:0 24px 70px rgba(50,55,90,.18);text-align:center}.zou{font-size:14px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#6558d9}.home-card h1{font-size:clamp(40px,8vw,72px);line-height:.95;margin:10px 0 8px}.home-card .lead{font-size:clamp(17px,3vw,23px);font-weight:800;color:#5d6780;margin:0 auto 24px;max-width:680px}.play{border:0;border-radius:20px;padding:17px 38px;background:linear-gradient(90deg,#3b82f6,#7058e8,#db4f97);color:white;font-size:24px;font-weight:1000;cursor:pointer;box-shadow:0 12px 25px #6658d944;transition:.15s}.play:hover{transform:translateY(-2px) scale(1.02)}.home-stages{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:28px;text-align:left}.home-stage{border:2px solid #e1e5f0;background:#fff;border-radius:17px;padding:13px;min-height:92px;cursor:pointer;box-shadow:0 5px 14px #3d416d10}.home-stage:hover{border-color:#7567e7;transform:translateY(-2px)}.home-stage b{display:block;font-size:15px;color:#222b40;margin-bottom:5px}.home-stage span{font-size:12px;font-weight:800;color:#69738a}.home-stage .num{display:inline-flex;width:27px;height:27px;align-items:center;justify-content:center;border-radius:9px;background:#eeeaff;color:#5a4ed1;font-weight:1000;margin-bottom:8px}.home-note{margin-top:22px;font-size:13px;font-weight:800;color:#6a7387}.home-hidden{display:none!important}@media(max-width:720px){.home-screen{padding:12px;align-items:flex-start}.home-card{border-radius:24px;padding:24px 15px;margin-top:8px}.home-stages{grid-template-columns:repeat(2,1fr)}.play{width:100%}}
</style>
</head>
<body>
<main class="app" id="app">
  <section class="home-screen" id="homeScreen">
    <div class="home-card">
      <div class="zou">Zou_Maï • English games</div>
      <div style="font-size:72px;line-height:1;margin-top:8px">🎒</div>
      <h1>Back to School</h1>
      <p class="lead">Listen, look, match and build sentences. Complete the 7 challenges!</p>
      <button class="play" id="playBtn">▶ PLAY</button>
      <div class="home-stages" id="homeStages"></div>
      <div class="home-note">THE Méthode 3 • Lesson 1 · 10 items per stage</div>
    </div>
  </section>

  <header class="hero">
    <div class="hero-row"><div><div class="brand">THE Méthode 3 • Lesson 1</div><h1>🎒 Back to School</h1><p>7 stages • 10 items per stage</p></div><div class="stats"><div class="stat"><span>ITEM</span><b id="itemCount">1/10</b></div><div class="stat"><span>SCORE</span><b id="score">0</b></div></div></div>
    <div class="progress"><i id="progressFill"></i></div>
  </header>
  <nav class="stagebar" id="stagebar"></nav>
  <section class="panel" id="gamePanel">
    <div class="panel-head"><div><div class="stage-title" id="stageTitle"></div><div class="instruction" id="instruction"></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="audio-btn" id="homeBtn" style="background:#6558d9">⌂ Home</button><button class="audio-btn" id="replay">🔊 Listen again</button></div></div>
    <div class="prompt" id="prompt"></div>
    <div class="answers" id="answers"></div>
    <div id="extra"></div>
    <div class="feedback" id="feedback"></div>
    <div class="nav"><button class="next" id="next" disabled>Next →</button></div>
  </section>
  <section class="end hidden" id="endPanel"><div class="big" id="endIcon">🌟</div><h2 id="endTitle"></h2><p id="endText"></p><button class="primary" id="continueBtn">Next stage →</button></section>
</main>
<script>
const vocab=[
 {id:'notebook',word:'a notebook',base:'notebook',article:'a',img:'assets/images/notebook.png',audio:'assets/audio/a-notebook.mp3'},
 {id:'pencils',word:'coloured pencils',base:'coloured pencils',article:'Ø',img:'assets/images/coloured-pencils.png',audio:'assets/audio/coloured-pencils.mp3'},
 {id:'eraser',word:'an eraser',base:'eraser',article:'an',img:'assets/images/eraser.png',audio:'assets/audio/an-eraser.mp3'},
 {id:'glue',word:'a glue stick',base:'glue stick',article:'a',img:'assets/images/glue-stick.png',audio:'assets/audio/a-glue-stick.mp3'},
 {id:'pen',word:'a pen',base:'pen',article:'a',img:'assets/images/pen.png',audio:'assets/audio/a-pen.mp3'},
 {id:'ruler',word:'a ruler',base:'ruler',article:'a',img:'assets/images/ruler.png',audio:'assets/audio/a-ruler.mp3'},
 {id:'scissors',word:'scissors',base:'scissors',article:'Ø',img:'assets/images/scissors.png',audio:'assets/audio/scissors.mp3'},
 {id:'calculator',word:'a calculator',base:'calculator',article:'a',img:'assets/images/calculator.png',audio:'assets/audio/a-calculator.mp3'}
];
const sentences=[
 {type:'q',words:['Have','you','got','a','pen','?'],text:'Have you got a pen?'},
 {type:'pos',words:['I','have','got','a','pen','.'],text:'I have got a pen.'},
 {type:'neg',words:['I','haven’t','got','a','ruler','.'],text:'I haven’t got a ruler.'},
 {type:'q',words:['Have','you','got','an','eraser','?'],text:'Have you got an eraser?'},
 {type:'pos',words:['I','have','got','a','blue','pen','.'],text:'I have got a blue pen.',colour:true},
 {type:'neg',words:['I','haven’t','got','a','red','ruler','.'],text:'I haven’t got a red ruler.',colour:true},
 {type:'q',words:['Have','you','got','a','blue','pen','?'],text:'Have you got a blue pen?',colour:true},
 {type:'pos',words:['I','have','got','a','green','notebook','.'],text:'I have got a green notebook.',colour:true},
 {type:'neg',words:['I','haven’t','got','a','yellow','calculator','.'],text:'I haven’t got a yellow calculator.',colour:true},
 {type:'q',words:['Have','you','got','coloured','pencils','?'],text:'Have you got coloured pencils?'}
];
const stages=[
 {title:'1. Sound → Word',short:'Sound → Word',hint:'Listen and choose the correct word.',mode:'soundWord'},
 {title:'2. Sound → Picture',short:'Sound → Picture',hint:'Listen and choose the correct picture.',mode:'soundPicture'},
 {title:'3. Match Sound & Picture',short:'Match',hint:'Listen to a sound, then select its picture.',mode:'matching'},
 {title:'4. Picture → Word',short:'Picture → Word',hint:'Look at the picture and choose the correct word.',mode:'pictureWord'},
 {title:'5. A / AN / Ø',short:'A / AN / Ø',hint:'Choose a, an or no article.',mode:'article'},
 {title:'6. Build the Sentence',short:'Sentences',hint:'Put the word labels in the correct order.',mode:'sentence'},
 {title:'7. Final Challenge',short:'Final',hint:'A mixed challenge to finish!',mode:'final'}
];
const praise=['Well done!','Great job!','Excellent!','Fantastic!','Brilliant!','Amazing!','Perfect!','Super!','Very good!','Awesome!'];
let stageIndex=0,itemIndex=0,totalScore=0,errors=0,locked=false,current=null,sequence=[];
const $=s=>document.querySelector(s);const game=$('#gamePanel'),end=$('#endPanel'),prompt=$('#prompt'),answers=$('#answers'),extra=$('#extra'),feedback=$('#feedback'),next=$('#next'),replay=$('#replay');
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function tenItems(){const base=shuffle(vocab);const review=shuffle(vocab).slice(0,2).map((x,i)=>({...x,review:true,reviewN:i+1}));return [...base,...review]}
function playAudio(src){const a=new Audio(src);a.play().catch(()=>{})}
function renderStagebar(){const bar=$('#stagebar');bar.innerHTML='';stages.forEach((s,i)=>{const d=document.createElement('div');d.className='stage-chip '+(i===stageIndex?'active ':'')+(i<stageIndex?'done':'');d.innerHTML=`<strong>${i<stageIndex?'✓ ':''}${i+1}</strong>${s.short}`;d.style.cursor='pointer';d.onclick=()=>{stageIndex=i;startStage()};bar.appendChild(d)})}
function resetItem(){locked=false;current=null;answers.innerHTML='';extra.innerHTML='';feedback.className='feedback';feedback.textContent='';next.disabled=true;replay.hidden=false;$('#itemCount').textContent=`${Math.min(itemIndex+1,10)}/10`;$('#progressFill').style.width=`${Math.min((itemIndex+1)*10,100)}%`;$('#stageTitle').textContent=stages[stageIndex].title;$('#instruction').textContent=stages[stageIndex].hint}
function optionsFor(target){return shuffle([target,...shuffle(vocab.filter(v=>v.id!==target.id)).slice(0,3)])}
function setGood(btn){btn?.classList.add('correct');feedback.className='feedback good';feedback.textContent='⭐ '+praise[Math.floor(Math.random()*praise.length)]}
function setBad(btn,answer){btn?.classList.add('wrong');feedback.className='feedback bad';feedback.textContent='✗ Correct answer: '+answer}
function check(value,btn){if(locked)return;locked=true;next.disabled=false;if(value===current.answer){totalScore+=10;$('#score').textContent=totalScore;setGood(btn)}else{errors++;setBad(btn,current.label||current.answer)}}
function addTextChoice(label,value){const b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>check(value,b);answers.appendChild(b)}
function addImageChoice(v){const b=document.createElement('button');b.className='choice image-choice';b.innerHTML=`<img src="${v.img}" alt="">`;b.onclick=()=>check(v.id,b);answers.appendChild(b)}
function startStage(){itemIndex=0;errors=0;renderStagebar();game.classList.remove('hidden');end.classList.add('hidden');sequence=stages[stageIndex].mode==='sentence'?sentences:tenItems();renderItem()}
function renderItem(){resetItem();const mode=stages[stageIndex].mode;if(mode==='matching'){renderMatching();return}const x=sequence[itemIndex];
 if(mode==='soundWord'){current={answer:x.word,label:x.word,audio:x.audio};prompt.innerHTML='<div><div class="prompt-icon">🎧</div><div class="prompt-label">Listen!</div></div>';optionsFor(x).forEach(v=>addTextChoice(v.word,v.word));setTimeout(()=>playAudio(x.audio),120)}
 else if(mode==='soundPicture'){current={answer:x.id,label:x.word,audio:x.audio};prompt.innerHTML='<div><div class="prompt-icon">🔊</div><div class="prompt-label">Which picture?</div></div>';optionsFor(x).forEach(addImageChoice);setTimeout(()=>playAudio(x.audio),120)}
 else if(mode==='pictureWord'){current={answer:x.word,label:x.word};prompt.innerHTML=`<img class="hero-img" src="${x.img}" alt="">`;optionsFor(x).forEach(v=>addTextChoice(v.word,v.word))}
 else if(mode==='article'){current={answer:x.article,label:x.article};prompt.innerHTML=`<div><img class="hero-img" src="${x.img}" alt=""><div class="prompt-label" style="font-size:34px;color:#c25280">___ ${x.base}</div></div>`;['a','an','Ø'].forEach(v=>addTextChoice(v,v))}
 else if(mode==='sentence'){renderSentence(x)}
 else if(mode==='final'){renderFinal(x)}
}
function renderSentence(p){replay.hidden=true;const kind=p.type;const label=kind==='q'?'QUESTION':kind==='pos'?'POSITIVE':'NEGATIVE';prompt.innerHTML=`<div class="sentence-area"><span class="badge ${kind}">${label}</span>${p.colour?'<span class="badge col">+ COLOUR</span>':''}<div class="built" id="builtSentence"></div></div>`;const tiles=document.createElement('div');tiles.className='tiles';extra.appendChild(tiles);const built=[];shuffle(p.words.map((w,i)=>({w,i}))).forEach(o=>{const b=document.createElement('button');b.className='tile '+kind+(['blue','red','green','yellow'].includes(o.w)?' colour':'');b.textContent=o.w;b.onclick=()=>{if(b.disabled||locked)return;b.disabled=true;b.classList.add('used');built.push(o.w);$('#builtSentence').textContent=built.join(' ');if(built.length===p.words.length){locked=true;next.disabled=false;if(built.join(' ')===p.words.join(' ')){totalScore+=10;$('#score').textContent=totalScore;setGood()}else{errors++;setBad(null,p.text)}}};tiles.appendChild(b)})}
function renderFinal(x){const modes=['soundWord','soundPicture','pictureWord','article'];const mode=modes[itemIndex%modes.length];if(mode==='soundWord'){current={answer:x.word,label:x.word,audio:x.audio};prompt.innerHTML='<div><div class="prompt-icon">🎧</div><div class="prompt-label">Final challenge!</div></div>';optionsFor(x).forEach(v=>addTextChoice(v.word,v.word));setTimeout(()=>playAudio(x.audio),120)}else if(mode==='soundPicture'){current={answer:x.id,label:x.word,audio:x.audio};prompt.innerHTML='<div><div class="prompt-icon">🔊</div><div class="prompt-label">Final challenge!</div></div>';optionsFor(x).forEach(addImageChoice);setTimeout(()=>playAudio(x.audio),120)}else if(mode==='pictureWord'){current={answer:x.word,label:x.word};prompt.innerHTML=`<img class="hero-img" src="${x.img}" alt="">`;optionsFor(x).forEach(v=>addTextChoice(v.word,v.word))}else{current={answer:x.article,label:x.article};prompt.innerHTML=`<div><img class="hero-img" src="${x.img}" alt=""><div class="prompt-label" style="font-size:34px;color:#c25280">___ ${x.base}</div></div>`;['a','an','Ø'].forEach(v=>addTextChoice(v,v))}}
function renderMatching(){replay.hidden=true;$('#itemCount').textContent='10 pairs';$('#progressFill').style.width='0%';prompt.innerHTML='<div class="matching-wrap"><div><div class="prompt-label" style="margin:0 0 10px">🔊 Sounds</div><div class="sound-list" id="soundList"></div></div><div><div class="prompt-label" style="margin:0 0 10px">🖼️ Pictures</div><div class="picture-grid" id="pictureGrid"></div></div></div>';answers.innerHTML='';let selected=null,matched=0,localErrors=0;const targets=tenItems();const sounds=shuffle(targets.map((v,i)=>({...v,pair:i})));const pics=shuffle(targets.map((v,i)=>({...v,pair:i})));const sl=$('#soundList'),pg=$('#pictureGrid');sounds.forEach((v,i)=>{const b=document.createElement('button');b.className='sound-card';b.textContent='🔊 Sound '+(i+1);b.onclick=()=>{if(b.classList.contains('matched'))return;sl.querySelectorAll('.sound-card').forEach(x=>x.classList.remove('selected'));selected={pair:v.pair,button:b};b.classList.add('selected');playAudio(v.audio)};sl.appendChild(b)});pics.forEach(v=>{const b=document.createElement('button');b.className='match-image';b.innerHTML=`<img src="${v.img}" alt="">`;b.onclick=()=>{if(b.classList.contains('matched')||!selected)return;if(selected.pair===v.pair){selected.button.classList.add('matched');selected.button.classList.remove('selected');b.classList.add('matched');matched++;totalScore+=10;$('#score').textContent=totalScore;feedback.className='feedback good';feedback.textContent='⭐ '+praise[Math.floor(Math.random()*praise.length)];selected=null;$('#progressFill').style.width=(matched*10)+'%';if(matched===10){errors+=localErrors;next.disabled=false;locked=true;feedback.textContent='⭐ All 10 pairs matched!'}}else{localErrors++;selected.button.classList.remove('selected');selected=null;feedback.className='feedback bad';feedback.textContent='✗ Try again!'}};pg.appendChild(b)});current={matching:true};next.disabled=true}
function perfectAnimation(){const overlay=document.createElement('div');overlay.className='overlay';overlay.innerHTML='<div class="perfect-card"><div class="cup">🏆</div><h2>PERFECT!</h2><p>10 / 10 • NO MISTAKES!</p></div>';document.body.appendChild(overlay);for(let i=0;i<26;i++){const s=document.createElement('div');s.className='particle';s.textContent=['⭐','✨','🌟','🎉'][i%4];s.style.setProperty('--x',(Math.random()*700-350)+'px');s.style.setProperty('--y',(Math.random()*600-300)+'px');overlay.appendChild(s)}setTimeout(()=>overlay.remove(),2100)}
function finishStage(){game.classList.add('hidden');end.classList.remove('hidden');if(errors===0){$('#endIcon').textContent='🏆';$('#endTitle').textContent='Perfect!';$('#endText').textContent='10 out of 10 — no mistakes!';perfectAnimation()}else if(errors===1){$('#endIcon').textContent='🌟';$('#endTitle').textContent='Excellent!';$('#endText').textContent='Only one mistake. Great job!'}else if(errors<=3){$('#endIcon').textContent='👏';$('#endTitle').textContent='Well done!';$('#endText').textContent='Good work — keep going!'}else{$('#endIcon').textContent='💪';$('#endTitle').textContent='Keep going!';$('#endText').textContent='You can do even better on the next stage!'}$('#continueBtn').textContent=stageIndex===stages.length-1?'Play again ↻':'Next stage →'}
$('#homeBtn').onclick=()=>{$('#homeScreen').classList.remove('home-hidden');renderHome()};next.onclick=()=>{if(itemIndex<9 && stages[stageIndex].mode!=='matching'){itemIndex++;renderItem()}else finishStage()};replay.onclick=()=>{if(current?.audio)playAudio(current.audio)};$('#continueBtn').onclick=()=>{if(stageIndex<stages.length-1){stageIndex++;startStage()}else{stageIndex=0;itemIndex=0;totalScore=0;$('#score').textContent='0';startStage()}};

function renderHome(){const box=$('#homeStages');box.innerHTML='';stages.forEach((st,i)=>{const b=document.createElement('button');b.className='home-stage';b.innerHTML=`<div class="num">${i+1}</div><b>${st.short}</b><span>${st.hint}</span>`;b.onclick=()=>{stageIndex=i;$('#homeScreen').classList.add('home-hidden');startStage()};box.appendChild(b)})}
$('#playBtn').onclick=()=>{$('#homeScreen').classList.add('home-hidden');stageIndex=0;startStage()};
renderHome();
startStage();
</script>
</body>
</html>
